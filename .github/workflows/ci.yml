name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun ci
      - name: Audit dependencies
        run: bun audit
      - name: Run quality gate
        run: bun run check
      - name: Install tools for real media regression tests
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Run unit tests
        run: bun test
        env:
          NANIME_ADMIN_SETUP_TOKEN: nanime-ci-test-token-with-thirty-two-characters
          NANIME_DATABASE: /tmp/nanime-ci-tests.sqlite
      - name: Build production bundle
        run: bun run build
