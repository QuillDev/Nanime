name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun ci
      - name: Audit dependencies
        run: bun audit
      - name: Run quality gate
        run: bun run check
      - name: Install tools for real media regression tests
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Run unit tests
        run: bun test
        env:
          NANIME_ADMIN_SETUP_TOKEN: nanime-ci-test-token-with-thirty-two-characters
          NANIME_DATABASE: /tmp/nanime-ci-tests.sqlite
      - name: Build production bundle
        run: bun run build

  player-browser:
    name: player-browser (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: journey
            file: tests/player/playerBrowser.test.ts
            ffmpeg: true
            pattern: navigates through a season
          - name: state-and-direct
            file: tests/player/playerBrowser.test.ts
            ffmpeg: true
            pattern: "marks an episode watched|direct playback accepts"
          - name: hls-resilience
            file: tests/player/playerBrowser.test.ts
            ffmpeg: true
            pattern: "recovers a transient HLS manifest|keeps controls visible"
          - name: library-files
            file: tests/player/libraryFilesBrowser.test.ts
            ffmpeg: false
            pattern: "."
          - name: admin-navigation
            file: tests/player/adminNavigationBrowser.test.ts
            ffmpeg: false
            pattern: "."
          - name: file-manager-package
            file: packages/file-manager/tests/fileManagerBrowser.test.ts
            ffmpeg: false
            pattern: "."
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Begin Chrome warmup
        run: |
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome)"
          chrome_profile="$RUNNER_TEMP/nanime-chrome"
          "$chrome_path" --headless --no-sandbox --disable-gpu --no-first-run \
            --no-default-browser-check --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=0 --user-data-dir="$chrome_profile" \
            --autoplay-policy=no-user-gesture-required about:blank \
            > "$RUNNER_TEMP/nanime-chrome.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/nanime-chrome.pid"
          echo "NANIME_CHROME_PROFILE=$chrome_profile" >> "$GITHUB_ENV"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun ci
      - name: Build production bundle
        run: bun run build
      - name: Build standalone file-manager fixture
        if: matrix.case.name == 'file-manager-package'
        run: bun run --cwd packages/file-manager build:demo
      - name: Restore pinned FFmpeg tools
        if: matrix.case.ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/ffmpeg
          key: ffmpeg-n8.1.2-44-g7c533d0f86-linux64-gpl
      - name: Download pinned FFmpeg tools
        if: matrix.case.ffmpeg && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          FFMPEG_ARCHIVE_SHA256: c86e5d9a6cdd824a0b1f220ebc43c57dec129df3252376988730a091d19be4ce
          FFMPEG_ARCHIVE_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-19-19-21/ffmpeg-n8.1.2-44-g7c533d0f86-linux64-gpl-8.1.tar.xz
        run: |
          mkdir --parents .ci/ffmpeg
          curl --fail --location --retry 3 --output /tmp/nanime-ffmpeg.tar.xz "$FFMPEG_ARCHIVE_URL"
          echo "$FFMPEG_ARCHIVE_SHA256  /tmp/nanime-ffmpeg.tar.xz" | sha256sum --check
          tar --extract --xz --file /tmp/nanime-ffmpeg.tar.xz --directory .ci/ffmpeg \
            --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          chmod +x .ci/ffmpeg/ffmpeg .ci/ffmpeg/ffprobe
      - name: Add FFmpeg tools to PATH
        if: matrix.case.ffmpeg
        run: echo "$GITHUB_WORKSPACE/.ci/ffmpeg" >> "$GITHUB_PATH"
      - name: Connect to warmed Chrome
        run: |
          for attempt in $(seq 1 300); do
            if test -s "$NANIME_CHROME_PROFILE/DevToolsActivePort"; then
              break
            fi
            sleep 0.05
          done
          if ! test -s "$NANIME_CHROME_PROFILE/DevToolsActivePort"; then
            cat "$RUNNER_TEMP/nanime-chrome.log"
            exit 1
          fi
          chrome_port="$(sed -n '1p' "$NANIME_CHROME_PROFILE/DevToolsActivePort")"
          chrome_path="$(sed -n '2p' "$NANIME_CHROME_PROFILE/DevToolsActivePort")"
          echo "NANIME_CHROME_URL=ws://127.0.0.1:$chrome_port$chrome_path" >> "$GITHUB_ENV"
      - name: Run player browser shard
        env:
          NANIME_PLAYER_E2E: "true"
          NANIME_LIBRARY_FILES_E2E: "true"
          NANIME_FILE_MANAGER_E2E: "true"
          PLAYER_TEST_FILE: ${{ matrix.case.file }}
          PLAYER_TEST_PATTERN: ${{ matrix.case.pattern }}
        run: |
          for attempt in 1 2; do
            bun test "$PLAYER_TEST_FILE" --timeout 120000 --test-name-pattern "$PLAYER_TEST_PATTERN" && exit 0
          done
          exit 1
      - name: Upload player harness diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: player-harness-diagnostics-${{ matrix.case.name }}
          path: test-results
          if-no-files-found: ignore
      - name: Stop warmed Chrome
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/nanime-chrome.pid"; then
            kill "$(cat "$RUNNER_TEMP/nanime-chrome.pid")" || true
          fi
