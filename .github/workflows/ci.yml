name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun ci
      - name: Audit dependencies
        run: bun audit
      - name: Run quality gate
        run: bun run check
      - name: Run unit tests
        run: bun test
      - name: Build production bundle
        run: bun run build
      - name: Install player harness system dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Run player browser harness
        run: NANIME_PLAYER_E2E=true bun test tests/player/playerBrowser.test.ts --timeout 120000
